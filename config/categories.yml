# Job categories. Used three ways, in this order:
#   1. keywords: matched against the job title (fast, explainable)
#   2. description: embedded once and compared with each job (zero-shot classifier)
#   3. the LLM, only when 1 and 2 disagree or are unsure (optional, slower)
# Edit freely: ids are stable keys, labels are what the UI shows.

